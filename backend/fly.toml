# Fly.io configuration for InvestIQ Backend
app = "investiq-backend"
primary_region = "iad"  # Washington DC - change if needed

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/market-ticker"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Persistent volume for company data cache
[[mounts]]
  source = "investiq_data"
  destination = "/app/data"
  initial_size = "1gb"
