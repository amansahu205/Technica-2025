name = "investiq-frontend"
compatibility_date = "2024-01-01"

# Cloudflare Pages Configuration
pages_build_output_dir = "out"

# D1 Database Binding (for adaptive quiz)
[[d1_databases]]
binding = "DB"
database_name = "investiq"
database_id = "fdb7c213-b732-4155-88c6-000900224c56"

# Environment Variables
[vars]
# Backend URL (Railway deployment)
BACKEND_URL = "https://technica-2025-production.up.railway.app"

# ElevenLabs API Key - Add via Cloudflare Dashboard or wrangler secret
# Run: npx wrangler pages secret put ELEVENLABS_API_KEY
# ELEVENLABS_API_KEY = "sk_..." (DO NOT commit this - use secrets!)
